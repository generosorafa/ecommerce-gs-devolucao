<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código de Devolução GS</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="copy-page">
      <section class="copy-panel" aria-live="polite">
        <header class="copy-header">
          <p>GS Devoluções</p>
          <h1>Código de devolução</h1>
        </header>

        <div class="code-area">
          <div class="code-topline">
            <span>Código atual</span>
            <time id="updatedAt">Carregando</time>
          </div>

          <output class="code-display" id="returnCode">Carregando...</output>

          <button
            class="copy-button"
            id="copyButton"
            type="button"
            disabled
            aria-label="Copiar código de devolução"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path
                d="M8 8.5C8 7.67 8.67 7 9.5 7H17C17.83 7 18.5 7.67 18.5 8.5V17C18.5 17.83 17.83 18.5 17 18.5H9.5C8.67 18.5 8 17.83 8 17V8.5Z"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M5.5 14.5H5C4.17 14.5 3.5 13.83 3.5 13V5C3.5 4.17 4.17 3.5 5 3.5H12.5C13.33 3.5 14 4.17 14 5V5.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span>Copiar código</span>
          </button>

          <p class="copy-status" id="copyStatus" role="status"></p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
